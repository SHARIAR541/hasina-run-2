:root{--bg:#f1e6cf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#15171b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none}
#w{width:min(100vw,calc(100vh*.5625));aspect-ratio:9/16}

#w{position:relative;font-size:min(6vw,3.375vh)}
.b{position:absolute;border:0;cursor:pointer;font:700 1em "Noto Sans Bengali",system-ui,sans-serif;touch-action:manipulation;-webkit-tap-highlight-color:transparent}

#bp svg,#bs svg{width:55%;height:55%;fill:#fff}
#br{display:none;left:50%;top:66%;transform:translate(-50%,-50%);padding:.55em 1.8em;font-size:1.3em;border-radius:2em;background:#06d6a0;color:#06251c;box-shadow:0 .2em 0 #04a07a;z-index:5}
